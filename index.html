<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>सामवेदग्रन्थसंहिता</title>
<meta name="description" content="ஸாமவேத ஸம்ஹிதை, ப்ராஹ்மணங்கள், கல்ப ஸூத்ரங்கள், ஶிக்ஷை — பாராயணப் பதிப்பு. இணையம் இல்லாமலும் இயங்கும்.">
<meta name="theme-color" content="#5B1530">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css?v=2026.11.13a">
</head>
<body>
<header class="bar"><div class="wrap">
  <a class="brand" href="#"><b>सामवेदग्रन्थसंहिता</b></a>
  <div class="tools">
    <div class="seg" id="scSeg" role="group" aria-label="எழுத்து"><button data-sc="deva">देव</button><button data-sc="gran" class="ta">க்ரந்த</button></div>
    <button class="ib" id="aMinus" aria-label="எழுத்து சிறிது">A−</button>
    <button class="ib" id="aPlus" aria-label="எழுத்து பெரிது">A+</button>
    <button class="ib" id="thBtn" aria-label="வண்ணம்">☾</button>
    <button class="ib" id="menuBtn" aria-label="பட்டியல்">☰</button>
  </div>
</div></header>

<div id="themes" class="pop" hidden>
  <div class="sw" data-th="auto"><i></i>தானாக</div>
  <div class="sw" data-th="light"><i></i>வெண்மை</div>
  <div class="sw" data-th="sepia"><i></i>தாள்</div>
  <div class="sw" data-th="olai"><i></i>ஓலை</div>
  <div class="sw" data-th="dusk"><i></i>அந்தி</div>
  <div class="sw" data-th="dark"><i></i>இருள்</div>
  <div class="sw" data-th="black"><i></i>கருமை</div>
</div>

<nav id="drawer" hidden><div class="dpanel">
  <a href="#">⌂ முகப்பு — நூல் பட்டியல்</a>
  <a href="#notes">⚑ என் பிழைக் குறிப்புகள் <span id="nCount"></span></a>
  <a href="#about">ⓘ இந்தத் தளம் பற்றி</a>
  <div id="dBooks"></div>
</div></nav>

<main class="wrap">
  <section id="home" hidden>
    <div class="search"><input id="q" type="search" placeholder="தேடுக — देवनागरी / latin" autocomplete="off" spellcheck="false"><button id="qGo" aria-label="தேடு">⌕</button></div>
    <div id="lastRead"></div>
    <div id="lib"></div>
  </section>
  <section id="book" hidden></section>
  <section id="reader" hidden>
    <div id="rHead"></div>
    <div id="rChips"></div>
    <div id="rBody"></div>
    <div id="rNav"></div>
  </section>
  <section id="results" hidden></section>
  <section id="notes" hidden></section>
  <section id="about" hidden></section>
</main>

<div id="layerPill" hidden><button id="layerBtn">பாடபேதம் / ஐயம்</button></div>

<div id="sheet" hidden><div class="sh">
  <div class="shHead"><b>பிழை தெரிவி</b><span id="shWhere"></span><button class="ib" id="shX" aria-label="மூடு">✕</button></div>
  <div id="shOrig" class="deva"></div>
  <label>சரியான பாடம் (இந்த வரியைத் திருத்துக)<textarea id="shFix" class="deva" rows="4"></textarea></label>
  <label>குறிப்பு (எந்தப் புத்தகம், பக்கம் …)<textarea id="shNote" rows="2"></textarea></label>
  <div class="shBtns"><button id="shSave" class="pri">சேமி</button><button id="shDel">நீக்கு</button></div>
  <p class="hint">குறிப்புகள் இந்தக் கருவியிலேயே சேமிக்கப்படும். «என் பிழைக் குறிப்புகள்» பக்கத்திலிருந்து அனுப்பலாம்.</p>
</div></div>

<div id="toast" hidden></div>
<script src="translit.js?v=2026.11.13a"></script>
<script src="app.js?v=2026.11.13a"></script>
</body>
</html>
