<!doctype html><html lang="ta"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>सामवेदग्रन्थसंहिता</title></head>
<body style="font-family:sans-serif;text-align:center;padding:3em 1em">
<p>வெளியீடு நிறுத்தப்பட்டுள்ளது.</p>
<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k)));
</script></body></html>
